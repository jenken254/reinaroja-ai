<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reina Roja AI - Entorno de Trabajo (2026)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; flex-direction: column; background-color: #1e1e24; color: #ececf1; height: 100vh; overflow: hidden; }
        
        #top-header { width: 100%; height: 90px; background-color: #202123; border-bottom: 1px solid #4d4d4f; display: flex; align-items: center; padding: 0 25px; gap: 15px; }
        .header-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #dc143c; }
        .header-info h1 { font-size: 18px; color: #ff4d4d; letter-spacing: 0.5px; }
        .header-info p { font-size: 12px; color: #9aca3c; text-transform: uppercase; }

        /* Controles de idioma y alineación derecha */
        .header-right { margin-left: auto; display: flex; align-items: center; gap: 20px; }
        .lang-selector { display: flex; gap: 6px; }
        .lang-btn { background: #2b2c33; color: #ff4d4d; border: 1px solid #dc143c; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 13px; transition: all 0.2s; }
        .lang-btn:hover, .lang-btn.active { background: #dc143c; color: #ffffff; }

        /* Contenedor principal con panel de chat y panel lateral derecho */
        #main-container { display: flex; flex: 1; overflow: hidden; }
        #chat-section { flex: 1; display: flex; flex-direction: column; background-color: #343541; overflow: hidden; }

        #messages { flex: 1; overflow-y: auto; padding: 20px 10%; display: flex; flex-direction: column; gap: 20px; }
        .message { display: flex; gap: 15px; padding: 15px 20px; border-radius: 8px; max-width: 85%; line-height: 1.6; }
        .user { background-color: #2b2c33; align-self: flex-end; color: #ececf1; border: 1px solid #40414f; }
        .bot { background-color: #444654; align-self: flex-start; border: 1px solid #565869; }
        .avatar-lateral { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid #dc143c; flex-shrink: 0; }
        .message-content { flex: 1; word-break: break-word; }

        /* Panel Lateral Derecho (Imagen e información de la Reina Roja) */
        #side-panel { width: 300px; background-color: #202123; border-left: 1px solid #4d4d4f; display: flex; flex-direction: column; align-items: center; padding: 20px; text-align: center; gap: 15px; }
        .side-image-container { width: 180px; height: 240px; border-radius: 10px; overflow: hidden; border: 2px solid #dc143c; box-shadow: 0 0 15px rgba(220, 20, 60, 0.4); }
        .side-image-container img { width: 100%; height: 100%; object-fit: cover; }
        .side-info h3 { color: #ff4d4d; font-size: 16px; margin-bottom: 5px; }
        .side-info p { color: #8e8ea0; font-size: 12px; line-height: 1.4; }

        #input-area { width: 100%; padding: 20px 10%; background-color: #202123; border-top: 1px solid #4d4d4f; }
        .input-box { display: flex; background-color: #40414f; border-radius: 12px; border: 1px solid #565869; box-shadow: 0 4px 15px rgba(0,0,0,0.3); padding: 12px 15px; align-items: center; gap: 10px; }
        textarea { flex: 1; background: none; border: none; color: white; resize: none; height: 24px; max-height: 120px; outline: none; font-size: 15px; }
        button#sendBtn { background: none; border: none; color: #ff4d4d; cursor: pointer; padding: 5px 10px; font-size: 20px; transition: transform 0.2s; }
        button#sendBtn:hover { transform: scale(1.1); }

        /* Adaptabilidad para pantallas móviles */
        @media (max-width: 900px) { #side-panel { display: none; } }
    </style>
</head>
<body>
    <div id="top-header">
        <img src="neo/imag/3.jpg" alt="Reina Roja" class="header-avatar" onerror="this.src='https://via.placeholder.com/50/dc143c/ffffff?text=RR'">
        <div class="header-info">
            <h1>Reina Roja AI</h1>
            <p>● Módulo Activo - 2026</p>
        </div>
        <div class="header-right">
            <div class="lang-selector">
                <button class="lang-btn active" id="btn-es" onclick="setLanguage('es')">ES</button>
                <button class="lang-btn" id="btn-jp" onclick="setLanguage('jp')">JP</button>
            </div>
        </div>
    </div>

    <div id="main-container">
        <div id="chat-section">
            <div id="messages">
                <div class="message bot">
                    <img src="neo/imag/5.jpg" alt="Reina Roja" class="avatar-lateral" onerror="this.src='https://via.placeholder.com/36/dc143c/ffffff?text=RR'">
                    <div class="message-content" id="welcome-msg">
                        Entorno de control activo para DEMIAN ALEX3NDER. Sistemas en línea. ¿Qué vector de análisis o código vamos a ejecutar?
                    </div>
                </div>
            </div>
            <div id="input-area">
                <div class="input-box">
                    <textarea id="userInput" placeholder="Escribe tu consulta o comando técnico..."></textarea>
                    <button id="sendBtn">➤</button>
                </div>
            </div>
        </div>

        <!-- Panel Lateral Derecho con Imagen y Estado -->
        <div id="side-panel">
            <div class="side-image-container">
                <img src="neo/imag/3.jpg" alt="Reina Roja Hologram" onerror="this.src='https://via.placeholder.com/180/202123/dc143c?text=REINA+ROJA'">
            </div>
            <div class="side-info">
                <h3>CORE DEEP-SEC</h3>
                <p>Módulo de Inteligencia Artificial Analítica v2026. Conexión cifrada de alta prioridad.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
