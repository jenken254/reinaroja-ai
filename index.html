<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reina Roja AI - Entorno de Trabajo (2026)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; flex-direction: column; background-color: #121316; color: #ececf1; height: 100vh; overflow: hidden; }
        
        #top-header { width: 100%; height: 70px; background-color: #1a1b20; border-bottom: 1px solid #dc143c44; display: flex; align-items: center; padding: 0 20px; gap: 15px; flex-shrink: 0; }
        .header-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #dc143c; }
        .header-info h1 { font-size: 16px; color: #ff4d4d; letter-spacing: 0.8px; text-transform: uppercase; }
        .header-info p { font-size: 11px; color: #9aca3c; text-transform: uppercase; font-weight: bold; }

        .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
        .lang-selector { display: flex; gap: 4px; flex-wrap: wrap; }
        .lang-btn { background: #212229; color: #ff4d4d; border: 1px solid #dc143c; padding: 4px 8px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 11px; transition: all 0.2s; }
        .lang-btn:hover, .lang-btn.active { background: #dc143c; color: #ffffff; }

        #main-container { display: flex; flex: 1; overflow: hidden; position: relative; }

        #history-sidebar { width: 260px; background-color: #16171d; border-right: 1px solid #2d2e38; display: flex; flex-direction: column; padding: 15px; gap: 12px; }
        .new-chat-btn { background-color: #dc143c; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; transition: background 0.2s; }
        .new-chat-btn:hover { background-color: #ff4d4d; }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .history-item { background-color: #1e1f26; padding: 10px; border-radius: 6px; font-size: 12px; cursor: pointer; color: #b4b4c7; border: 1px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item:hover, .history-item.active { background-color: #272832; border-color: #dc143c; color: #fff; }

        #chat-section { flex: 1; display: flex; flex-direction: column; background-color: #1e1e24; overflow: hidden; position: relative; }
        #messages { flex: 1; overflow-y: auto; padding: 20px 8%; display: flex; flex-direction: column; gap: 20px; }
        .message { display: flex; gap: 15px; padding: 15px 20px; border-radius: 8px; max-width: 85%; line-height: 1.6; font-size: 14px; }
        .user { background-color: #282933; align-self: flex-end; color: #ececf1; border: 1px solid #3c3d4d; }
        .bot { background-color: #22232b; align-self: flex-start; border: 1px solid #3d242a; flex-direction: column; }
        .bot-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; color: #ff4d4d; font-size: 13px; }
        .avatar-lateral { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid #dc143c; flex-shrink: 0; }
        .message-content { flex: 1; word-break: break-word; }
        
        .tts-btn { background: none; border: 1px solid #dc143c; color: #ff4d4d; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; align-self: flex-start; margin-top: 10px; transition: all 0.2s; }
        .tts-btn:hover { background: #dc143c; color: #fff; }

        #input-area { width: 100%; padding: 15px 8%; background-color: #16171d; border-top: 1px solid #2d2e38; }
        .input-box { display: flex; background-color: #22232c; border-radius: 10px; border: 1px solid #3d3e4d; padding: 10px 15px; align-items: center; gap: 10px; }
        textarea { flex: 1; background: none; border: none; color: white; resize: none; height: 24px; max-height: 120px; outline: none; font-size: 14px; }
        button#sendBtn { background: none; border: none; color: #ff4d4d; cursor: pointer; padding: 5px 10px; font-size: 18px; transition: transform 0.2s; }
        button#sendBtn:hover { transform: scale(1.15); }

        #side-panel { width: 260px; background-color: #16171d; border-left: 1px solid #2d2e38; display: flex; flex-direction: column; align-items: center; padding: 20px; text-align: center; gap: 15px; }
        .side-image-container { width: 160px; height: 220px; border-radius: 8px; overflow: hidden; border: 2px solid #dc143c; }
        .side-image-container img { width: 100%; height: 100%; object-fit: cover; }
        .side-info h3 { color: #ff4d4d; font-size: 14px; margin-bottom: 5px; }
        .side-info p { color: #8e8ea0; font-size: 11px; line-height: 1.4; }

        @media (max-width: 1000px) { #side-panel { display: none; } }
        @media (max-width: 768px) { #history-sidebar { display: none; } }
    </style>
</head>
<body>
    <div id="top-header">
        <img src="neo/imag/3.jpg" alt="Reina Roja" class="header-avatar" onerror="this.src='https://via.placeholder.com/42/dc143c/ffffff?text=RR'">
        <div class="header-info">
            <h1>Reina Roja AI</h1>
            <p>● Módulo Activo - 2026</p>
        </div>
        <div class="header-right">
            <div class="lang-selector">
                <button class="lang-btn active" id="btn-es" onclick="setLanguage('es')">ES</button>
                <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
                <button class="lang-btn" id="btn-jp" onclick="setLanguage('jp')">JP</button>
                <button class="lang-btn" id="btn-zh" onclick="setLanguage('zh')">ZH</button>
                <button class="lang-btn" id="btn-ko" onclick="setLanguage('ko')">KO</button>
                <button class="lang-btn" id="btn-fr" onclick="setLanguage('fr')">FR</button>
                <button class="lang-btn" id="btn-it" onclick="setLanguage('it')">IT</button>
            </div>
        </div>
    </div>

    <div id="main-container">
        <div id="history-sidebar">
            <button class="new-chat-btn" onclick="iniciarNuevaSesion()">+ Nueva Sesión</button>
            <div class="history-list" id="historyListContainer"></div>
        </div>

        <div id="chat-section">
            <div id="messages">
                <div class="message bot">
                    <div class="bot-header">
                        <img src="neo/imag/5.jpg" alt="Reina Roja" class="avatar-lateral" onerror="this.src='https://via.placeholder.com/30/dc143c/ffffff?text=RR'">
                        <strong>Reina Roja</strong>
                    </div>
                    <div class="message-content" id="welcome-msg">
                        Entorno de control activo para DEMIAN ALEX3NDER. Sistemas en línea. ¿Qué vector de análisis o código vamos a ejecutar?
                    </div>
                </div>
            </div>
            <div id="input-area">
                <div class="input-box">
                    <textarea id="userInput" placeholder="Escribe tu consulta o comando técnico..."></textarea>
                    <button id="sendBtn">➤</button>
                </div>
            </div>
        </div>

        <div id="side-panel">
            <div class="side-image-container">
                <img src="neo/imag/3.jpg" alt="Reina Roja Hologram" onerror="this.src='https://via.placeholder.com/160/202123/dc143c?text=REINA+ROJA'">
            </div>
            <div class="side-info">
                <h3>CORE DEEP-SEC</h3>
                <p>Módulo de Inteligencia Artificial Analítica v2026. Conexión cifrada activa.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
